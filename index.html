<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workplace Booking System</title>
  <link rel="stylesheet" href="styles.css">
  
</head>
<!-- Add this near your top navigation or header -->
<div id="authContainer" class="auth-bar" style="padding: 10px; background: #f8f9fa; border-bottom: 1px solid #dee2e6; display: flex; justify-content: flex-end; align-items: center; gap: 10px;">
  
  <!-- View when logged out -->
  <div id="loggedOutView">
    <input type="email" id="loginEmailInput" placeholder="staff@yourschool.edu" style="padding: 6px; border-radius: 4px; border: 1px solid #ccc; width: 220px;" />
    <button onclick="sendMagicLink()" style="padding: 6px 12px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Send Magic Link</button>
  </div>

  <!-- View when logged in -->
  <div id="loggedInView" style="display: none; align-items: center; gap: 10px;">
    <span style="font-size: 14px;">Logged in as: <strong id="userDisplayEmail"></strong> (<span id="userDisplayRole" style="color: #007bff; text-transform: uppercase;"></span>)</span>
    <button onclick="handleSignOut()" style="padding: 6px 12px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">Sign Out</button>
  </div>

</div>
<body>

  <header>
    <!-- Replace the old role dropdown/buttons in your top header with this: -->
<div style="display: flex; align-items: center; gap: 10px;">
  <span style="font-size: 0.85rem; color: #555;">Role:</span>
  <span id="userRoleBadge" style="font-size: 0.85rem; font-weight: bold; padding: 4px 8px; background: #e9ecef; border-radius: 4px; text-transform: capitalize;">User</span>
</div>
    <div class="brand">
      <h1>🏫 School Space Booking</h1>
      <div class="role-switcher">
        <button class="role-btn active" id="roleUser" onclick="switchRole('user')">Teacher View</button>
        <button class="role-btn" id="roleAdmin" onclick="switchRole('admin')">Admin View</button>
      </div>
    </div>

    <div class="controls">
      <div class="date-picker-group">
        <input type="date" id="datePicker">
      </div>

      <div class="filter-group">
        <select id="typeFilter" onchange="renderGrid()">
          <option value="ALL">All Spaces</option>
          <option value="Meeting Room">Meeting Rooms</option>
          <option value="Desk">Desks</option>
          <option value="Quiet Pod">Quiet Pods</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="openBookingModal()">+ New Booking</button>
      <button class="btn btn-secondary" onclick="toggleOutbox()">📬 Email Log (<span id="emailCount">0</span>)</button>
    </div>
  </header>

  <div class="schedule-container">
    <div class="time-column">
      <div class="time-header"></div>
      <div class="time-slots-wrapper" id="timeColumnSlots"></div>
    </div>

    <div class="grid-viewport" id="gridViewport"></div>
  </div>

  <!-- Booking Modal -->
  <div class="modal-overlay" id="bookingModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Book a Space</h3>
        <button class="btn btn-secondary" style="padding: 2px 8px;" onclick="closeBookingModal()">✕</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="bookingId">
        
        <div class="form-group">
          <label>Space / Resource</label>
          <select id="modalResource"></select>
        </div>

        <div class="form-group">
          <label>Title / Purpose</label>
          <input type="text" id="modalTitleInput" placeholder="e.g. Science Dept Sync">
        </div>

        <div class="form-group">
          <label>Reserved For (Name)</label>
          <input type="text" id="modalUser" placeholder="e.g. Jane Doe">
        </div>

        <div class="form-group">
          <label>User Email (for notifications)</label>
          <input type="email" id="modalEmail" placeholder="teacher@school.edu">
        </div>

        <!-- START & END TIME ROW -->
<div style="display: flex; gap: 15px; margin-top: 15px;">
  <div style="flex: 1;">
    <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 5px;">Start Time</label>
    <select id="modalStartTime" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;"></select>
  </div>
  <div style="flex: 1;">
    <label style="font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 5px;">End Time</label>
    <select id="modalEndTime" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;"></select>
  </div>
</div>

<!-- RECURRING BOOKING OPTIONS (STACKED BELOW) -->
<div class="form-group" style="margin-top: 15px; padding: 12px; background: #f8f9fa; border-radius: 6px; border: 1px solid #dee2e6;">
  <label style="font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 5px;">Repeat Booking</label>
  <select id="repeatFrequency" onchange="toggleRepeatOptions()" style="width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc;">
    <option value="none">Does not repeat</option>
    <option value="daily">Daily</option>
    <option value="weekly">Weekly</option>
    <option value="monthly">Monthly</option>
  </select>

  <!-- Conditional Container for Repeat Rules -->
  <div id="repeatSettingsContainer" style="display: none; margin-top: 10px; gap: 10px; align-items: center;">
    <div style="flex: 1; margin-bottom: 8px;">
      <label style="font-size: 0.8rem; display: block; margin-bottom: 3px;">End Type</label>
      <select id="repeatEndType" onchange="toggleEndType()" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc;">
        <option value="count">Number of occurrences</option>
        <option value="date">Until specific date</option>
      </select>
    </div>
    
    <div id="repeatCountWrapper" style="flex: 1; margin-bottom: 8px;">
      <label style="font-size: 0.8rem; display: block; margin-bottom: 3px;">Occurrences</label>
      <input type="number" id="repeatCount" value="4" min="1" max="52" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc;" />
    </div>

    <div id="repeatDateWrapper" style="flex: 1; display: none; margin-bottom: 8px;">
      <label style="font-size: 0.8rem; display: block; margin-bottom: 3px;">Until Date</label>
      <input type="date" id="repeatEndDate" style="width: 100%; padding: 6px; border-radius: 4px; border: 1px solid #ccc;" />
    </div>
  </div>
</div>
<div style="margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px;">
  <button type="button" onclick="closeBookingModal()" style="padding: 8px 16px; background: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">Cancel</button>
  <button type="button" onclick="saveBooking()" style="padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Confirm Booking</button>
</div>
  </div>
</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="deleteBtn" style="display:none; color: #dc2626; border-color: #fca5a5;" onclick="deleteBooking()">Cancel Booking</button>
        <button class="btn btn-secondary" onclick="closeBookingModal()">Close</button>
        <button class="btn btn-primary" id="saveBookingBtn" onclick="saveBooking()">Save Booking</button>
      </div>
    </div>
  </div>

  <!-- Simulated Email Outbox Drawer -->
  <div class="outbox-drawer" id="outboxDrawer">
    <div class="outbox-header">
      <h3>📬 Email Outbox</h3>
      <button class="btn btn-secondary" style="padding: 2px 8px;" onclick="toggleOutbox()">✕</button>
    </div>
    <div class="outbox-content" id="outboxList">
      <p style="font-size: 0.85rem; color: var(--text-muted); text-align: center;">No emails sent yet.</p>
    </div>
  </div>
<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

</body>
</html>
